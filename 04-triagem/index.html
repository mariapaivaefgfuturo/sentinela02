<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.cdnfonts.com/css/poppins" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5 mb-3 shadow p-4">

        <div class="card-box shadow p-3 titulo">
            <h1 class="text-center"><strong>Triagem</strong></h1>
        </div>

        <div class="card-box shadow mt-4 p-4 paba">
            <h2 class="tp">Campos Obrigatórios</h2>
            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Pressão arterial: </label>
                    <input type="number" class="form-control">
                </div>
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Frequência cardíaca: </label>
                    <input type="number" class="form-control">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Saturação de oxigênio: </label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Temperatura: </label>
                    <input type="number" class="form-control">
                </div>
            </div> 

            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Dor no peito: </label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Falta de ar: </label>
                    <input type="text" class="form-control">
                </div>
            </div> 
            <div class="row">
                <div class="col-md-12 mb-3 mt-3">
                    <label class="form-label">Sintomas Prinipais</label>
                    <textarea class="form-control"></textarea>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Classificação de Risco</label>
                    <select class="form-select">
                        <option selected disabled> Selecione</option>
                        <option class="bl">Não urgente</option>
                        <option class="gr">Pouco Urgente</option>
                        <option class="yl">Urgente</option>
                        <option class="lr">Muito Urgente</option>
                        <option class="rd">Emergência</option>
                    </select>
                </div>

                <div class="col-md-6  mt-3 mb-3">
                    <label class="form-label">Tontura ou desmaio:</label>
                    <input type="text" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 mb-3 mt-3">
                    <label class="form-label">Histórico de doenças cardíacas e fatores de risco:</label>
                    <input type="text" class="form-control">
                </div>
            </div>

            <div class="row">
                <div class="mb-3 mt-4">
                    <button class="button w-100 p-4 by"><a href="../05-medico/index.html" class="link">Enviar</a></button>
                </div>
            </div>

    </div>
    
</body>
</html>
