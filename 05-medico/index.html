<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/poppins" rel="stylesheet">
    <link rel="shortcut icon" href="/Projeto Sentinela/favicon.ico" type="image/x-icon">
    <title>Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <!--
    <header class="topo">
        <h1>Hospital Home</h1>
        <p>Módulo: Atendimento Médico</p>
    </header>
-->

    


    <div id="maior">
    <div class="container mt-4">

        <div class="text-center mb-4">
            <strong><h1>Hospital Home</h1></strong>
            <p>Módulo: Atendimento Médico</p>
        </div>

        <div class="card-box shadow meir">
            <h3>Prontuário do Paciente</h3>

            <div class="row">
                <div class="col-md-6">
                    <p><strong>Nome:</strong>João da Silva</p>
                    <p><strong>CPF:</strong>000.000.000.-00</p>
                    <p><strong> Data de Nascimento:</strong> 01/01/1990</p>
                </div>
                
                <div class="col-md-6">
                    <p><strong>Sexo:</strong>Masculino</p>
                    <p><strong>Telefone</strong>(61)99999-9999</p>
                    <p><strong>Convênio:</strong> SUS</p>
                </div>
            </div>
        </div>
        <div class="card-box shadow ficha">

            <h3>Registro de Atendimento</h3>

            <div class="campo">
                <label> CRM do Médico:</label>
                <input type="text" placeholder="Digite o CRM">
            </div>
            
            <div class="campo">
                <label> Queixa Principal:</label> 
                <textarea placeholder=" Descreva o motivo da consulta(ex.: dor no peito, falta de ar, palpitações, tontura, inchaço, etc.)."></textarea>
            </div>
            
            <div class="campo">
                <label> Tempo de Evolução:</label> 
                <textarea placeholder=" Há quanto tempo os sintomas começaram?"></textarea>
            </div>
            
            <div class="campo">
                <label> Sintomas Relacionados: </label> 
                <textarea placeholder="Quais sintomas o paciente está apresentando?(ex.: dor no peito, cansaço, falta de ar, etc.)."></textarea>
            </div>
            
            <div class="campo">
                <label> Histórico de Doenças Anteriores: </label> 
                <textarea placeholder=" Possui alguma doença cardiaca ou outra condição de saúde relevante?(ex.: hipertensão, diabetes, colesterol alto, etc.)."></textarea>
            </div> 
            
            
            <div class="campo">
                <label> Histórico Familiar:</label> 
                <textarea placeholder=" Há casos de doenças cardíacas na família? (ex.: infarto, hipertensão, arritmias, morte súbita, etc.)."></textarea>
            </div> 

            
            <div class="campo">
                <label> Fatores de Risco:</label> 
                <textarea placeholder=" Possui fatores de risco para doenças cardíacas? (ex.: hipertensão, diabetes, colesterol alto, tabagismo, sedentarismo, obesidade, etc.)."></textarea>
            </div> 

            
            <div class="campo">
                <label> Uso de Medicamentos:</label> 
                <textarea placeholder=" Quais medicamentos o paciente utiliza atualmente? (ex.: anti-hipertensivos, anticoagulantes, estatinas, etc.)."></textarea>
            </div> 

            
            <div class="campo">
                <label> Alergias: </label> 
                <textarea placeholder=" Registro visível de alergia a medicamentos, alimentos ou outras substâncias."></textarea>
            </div> 

            
            <div class="campo">
                <label> Eletrocardiograma(ECG): </label> 
                <textarea placeholder=" Resultado do ECG (se realizado)"></textarea>
            </div> 


            <div class="campo">
                <label> Exames Complementares: </label> 
                <textarea placeholder=" Outros exames realizados (ex.: ecocardiograma, exames laboratorais, etc.)."></textarea>
            </div> 
            
            <div class="botoes">
                <button class="btn-salvar">Salvar Atendimento</button>
                <button class="btn-secundario"> <a href="../06-prescrição/index.html" class="link-prescricao">Ir para prescrição</a></button>
            </div>           

        </div>
    </div>
    </div>

</body>
</html>
